version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      opentelemetry:
        patterns:
          - "@opentelemetry/*"
    ignore:
      # TypeScript 7 (native compiler) is not yet supported by ts-jest / typescript-eslint
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # typeorm declares ioredis ^5 as a peer; ioredis 6 can't be installed alongside it
      - dependency-name: ioredis
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: /mcp-server
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # TypeScript 7 (native compiler) is not yet supported by ts-jest / typescript-eslint
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Stay on the Node LTS line used in production
      - dependency-name: node
        update-types: ["version-update:semver-major"]
